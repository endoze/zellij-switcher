name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - run: cargo build --release --target wasm32-wasip1
      - name: Generate checksum
        run: |
          cd target/wasm32-wasip1/release
          sha256sum zellij-switcher.wasm > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/wasm32-wasip1/release/zellij-switcher.wasm
            target/wasm32-wasip1/release/checksums.txt
